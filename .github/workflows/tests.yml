name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://support:ci_test_password@127.0.0.1:5432/support_agent
      RUN_DATABASE_TESTS: "1"
      VOYAGE_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: support_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize test database
        run: python -m app.init_db
      - name: Run unit and database integration tests
        run: python -m unittest discover -s tests -v
